<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SATB2 follow-up results</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#243746;background:#f3f6f8;font-size:16px}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dce5eb;padding:26px max(24px,calc((100vw - 1500px)/2))}h1{font-size:27px;letter-spacing:-.6px;margin:0 0 9px}h2{font-size:23px;letter-spacing:-.4px;margin:0 0 12px}h3{font-size:17px;margin:0 0 9px}p{line-height:1.65;margin:8px 0;color:#4c6373}.role{font-size:14px;max-width:1050px}main{max-width:1550px;padding:24px;margin:auto}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}button,select,input{font:inherit}nav button{background:#fff;border:1px solid #cadbe6;padding:15px 12px;text-align:left;border-radius:9px;font-weight:650;color:#385366;cursor:pointer}nav button.active{background:#1e526e;color:#fff;border-color:#1e526e}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #ecb45f;outline-offset:3px}.badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.2px;border-radius:5px;padding:6px 9px;background:#e4eff5;color:#28536a;overflow-wrap:anywhere}.badge.warn{background:#fff1d6;color:#7b570f}.badge.blocked{background:#f6e7e7;color:#883c3c}.summary{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;margin-bottom:24px}.panel{background:#fff;border:1px solid #dce5eb;padding:22px;border-radius:10px}.finding{font-size:18px;font-weight:600;line-height:1.5;color:#243f50;margin:14px 0}.summary ul{padding-left:22px;margin:8px 0;line-height:1.7}.muted{color:#687f8e;font-size:13px}.toolbar{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:14px;padding:18px;background:#e9f0f4;border:1px solid #d8e3ea;border-radius:9px;margin-bottom:20px}label{font-size:12px;font-weight:650;color:#496474;display:grid;gap:7px}select,input{width:100%;min-width:0;background:#fff;border:1px solid #bbcdd9;border-radius:6px;padding:9px;color:#2b495b;font-size:14px}.search{grid-column:span 2}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.plot-card{background:#fff;border:1px solid #d7e3eb;border-radius:10px;overflow:hidden}.plot-card .caption{padding:17px 19px;border-top:1px solid #e8eef2}.plot-card img{display:block;width:100%;height:430px;object-fit:contain;background:#fff;padding:8px}.plot-card a.image-link{display:block}.meta{font-size:12px;color:#69808f;line-height:1.6;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}a{color:#21658b;text-decoration:none}a:hover{text-decoration:underline}.link-button{border:1px solid #bdd4e2;border-radius:6px;padding:7px 11px;font-size:13px;background:#f3f8fb;font-weight:600}.count{margin:15px 0;color:#5c7585;font-size:14px}.empty{padding:36px;border:1px dashed #b9cbd6;border-radius:9px;text-align:center;background:#fff;color:#5a7282}.tables{margin-top:26px}.table-row{padding:13px 0;border-bottom:1px solid #e4ebef}.table-row summary{cursor:pointer;font-size:14px;font-weight:600;line-height:1.5}.table-scroll{overflow:auto;max-height:370px;margin-top:13px}table{border-collapse:collapse;white-space:nowrap;font-size:12px;width:100%}td,th{border:1px solid #e1e9ed;padding:7px 10px;text-align:left}th{background:#eef4f7;position:sticky;top:0}details.provenance{margin-top:22px;background:#fff;padding:20px;border:1px solid #d9e4eb;border-radius:9px}pre{white-space:pre-wrap;font-size:12px;line-height:1.6;max-height:400px;overflow:auto;color:#496171}.footer{font-size:13px;color:#718795;margin:28px 0}.screen-only-note{font-size:13px;color:#6c7e8b;margin:10px 0}.split-title{display:flex;gap:18px;align-items:flex-start;justify-content:space-between}.download-list{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}.review-list{display:grid;gap:10px;margin-top:15px}.file-path{font-family:ui-monospace,monospace;font-size:11px;color:#718795;overflow-wrap:anywhere}.only-links{margin-top:15px;padding:15px;background:#eef4f7;border-radius:7px}.only-links p{font-size:13px}.hidden{display:none!important}@media(max-width:1050px){.toolbar{grid-template-columns:repeat(3,minmax(130px,1fr))}.summary{grid-template-columns:1fr}nav{grid-template-columns:repeat(2,1fr)}.plot-card img{height:350px}}@media(max-width:680px){main{padding:14px}header{padding:20px}.gallery{grid-template-columns:1fr}.toolbar{grid-template-columns:repeat(2,minmax(110px,1fr))}nav{grid-template-columns:1fr}.plot-card img{height:auto;max-height:500px}.split-title{display:block}.badge{margin-bottom:14px}}
</style></head><body><header><h1 id="page-title"></h1><p class="role" id="role"></p><div id="delivery"></div></header><main><nav id="tabs" aria-label="Analysis tasks"></nav><div id="content"></div><p class="footer">Native scientific tables and model outputs remain authoritative. Display selections do not change nuclei, models, statistical thresholds or results.</p></main>
<script>
const INDEX=/*__REVIEWED_NATIVE_NAVIGATION__*/;
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
let current='composition',filters={scope:'',cohort:'',method:'',direction:'',plot:'',rendering:'',search:''};
const link=(text,href,cls='link-button')=>{let a=el('a',text,cls);a.href=href;if(cls==='link-button'&&!/^https:/i.test(href)&&(/^(PNG|Original PDF|Archival PDF|Readable PDF|Download original|Download complete original)/.test(text)))a.download='';return a};
document.title=INDEX.title;document.getElementById('page-title').textContent=INDEX.title;document.getElementById('role').textContent=INDEX.reader_role;
if(INDEX.delivery?.mode==='online'){let delivery=el('div',undefined,'only-links');delivery.append(el('h3','Online preview and complete offline download'),el('p',INDEX.delivery.note),link('Download complete portable ZIP',INDEX.delivery.portable_zip_url),el('p',`${INDEX.delivery.portable_zip_bytes.toLocaleString()} bytes · SHA256 ${INDEX.delivery.portable_zip_sha256}`,'file-path'));document.getElementById('delivery').append(delivery)}
function matches(a){return ['scope','cohort','method','direction','plot'].every(k=>!filters[k]||a[k]===filters[k])&&(!filters.rendering||!['.png','.pdf'].includes(a.extension)||a.rendering===filters.rendering)&&(!filters.search||(a.plot+' '+a.relative_native_path+' '+a.status).toLowerCase().includes(filters.search.toLowerCase()))}
function choose(task){current=task;const selected=INDEX.tasks.find(t=>t.id===task);filters={scope:'',cohort:'',method:'',direction:'',plot:'',rendering:selected.default_rendering||'',search:''};render()}
function controls(task){const box=el('div',undefined,'toolbar');for(const k of ['scope','cohort','method','direction','plot','rendering']){let label=el('label',({scope:'Native scope',cohort:'Cohort / condition',method:'Method',direction:'Direction',plot:'Plot / source type',rendering:'Figure rendering'})[k]);let select=el('select');select.dataset.control=k;const all=el('option','All saved views');all.value='';select.append(all);[...new Set(task.assets.filter(a=>k!=='rendering'||['.png','.pdf'].includes(a.extension)).map(a=>a[k]))].sort().forEach(v=>{let o=el('option',v);o.value=v;select.append(o)});select.value=filters[k];select.onchange=()=>{filters[k]=select.value;renderAssets(task)};label.append(select);box.append(label)}let search=el('label','Find a plot or file','search'),input=el('input');input.placeholder='Search native plot titles, tables or status';input.value=filters.search;input.oninput=()=>{filters.search=input.value;renderAssets(task)};search.append(input);box.append(search);return box}
function render(){const tabs=document.getElementById('tabs');tabs.replaceChildren();INDEX.tasks.forEach(t=>{let b=el('button',t.title,t.id===current?'active':'');b.type='button';b.onclick=()=>choose(t.id);b.setAttribute('aria-pressed',String(t.id===current));tabs.append(b)});const task=INDEX.tasks.find(t=>t.id===current),root=document.getElementById('content');root.replaceChildren();let summary=el('section',undefined,'summary'),overview=el('div',undefined,'panel'),head=el('div',undefined,'split-title');head.append(el('h2',task.title));let badge=el('span',task.native_status,'badge'+(task.native_status.includes('BLOCKED')?' blocked':task.native_status.includes('INCONCLUSIVE')?' warn':''));head.append(badge);overview.append(head,el('p',task.headline,'finding'));let list=el('ul');task.findings.forEach(f=>list.append(el('li',f)));overview.append(list);let limits=el('div',undefined,'panel');limits.append(el('h3','Interpretation and limits'));let ul=el('ul');task.limitations.forEach(f=>ul.append(el('li',f)));limits.append(ul);summary.append(overview,limits);root.append(summary);
 if(task.id==='velocity'){let box=el('div',undefined,'panel');box.append(el('h3','RNA velocity has not been run'),el('p','No velocity, latent-time or stream-arrow plots are supplied. The current input assessment is blocked; the saved assessment and review document the missing inputs.'));box.append(link('Open input assessment',task.seal_href));const review=el('div',undefined,'review-list');task.reviews.forEach(r=>review.append(link(r.label,r.href)));box.append(review);root.append(box)}else{if(task.original_layout_warning){let warning=el('div',undefined,'panel');warning.append(el('span','Archival display warning','badge warn'),el('p',task.original_layout_warning));root.append(warning)}root.append(controls(task));let count=el('p',undefined,'count');count.id='visible-count';let gallery=el('div',undefined,'gallery');gallery.id='gallery';let sources=el('section',undefined,'panel tables');sources.append(el('h3','Native tables and supporting files'));let tables=el('div');tables.id='sources';sources.append(tables);root.append(count,gallery,sources);renderAssets(task)}
 const prov=el('details',undefined,'provenance');prov.append(el('summary','Native provenance, reviews and complete model downloads'));const actions=el('div',undefined,'download-list');actions.append(link('Original native terminal seal',task.seal_href));if(task.archive_url)actions.append(link('Complete native archive',task.archive_url));actions.append(link('Portable file receipts','READER_MANIFEST.json'),link('Large native artifact index','NATIVE_ARCHIVE_ONLY_FILES.json'));if(INDEX.delivery?.mode==='online')actions.append(link('Online transport receipts','ONLINE_TRANSPORT_MANIFEST.json'));if(task.layout_provenance){actions.append(link('Layout repair seal',task.layout_provenance.seal_href),link('Original → readable plot mapping',task.layout_provenance.mapping_href));prov.append(el('p',task.layout_provenance.note,'screen-only-note'));}prov.append(actions,el('p',task.archive_note,'screen-only-note'));task.reviews.forEach(r=>prov.append(link(r.label,r.href)));prov.append(el('pre',JSON.stringify(task.native_summary,null,2)));root.append(prov)}
function renderAssets(task){let selected=task.assets.filter(matches),images=selected.filter(a=>a.extension==='.png'),gallery=document.getElementById('gallery'),sources=document.getElementById('sources');gallery.replaceChildren();sources.replaceChildren();document.getElementById('visible-count').textContent=`${images.length} native figure${images.length===1?'':'s'} · ${selected.filter(a=>a.extension!=='.png').length} matching PDF/table/source files`;
 if(!images.length)gallery.append(el('div','No native figure matches these saved-view selections. Try clearing a selector; unavailable outcomes remain visible in the native statuses.','empty'));
 images.forEach(a=>{let card=el('article',undefined,'plot-card'),imageLink=link('',a.href,'image-link'),img=el('img');img.src=a.href;img.alt=a.plot+' · '+a.scope+' · '+a.cohort;img.loading='lazy';img.dataset.loadState='pending';img.onload=()=>{img.dataset.loadState='loaded'};img.onerror=()=>{img.dataset.loadState='error';imageLink.append(el('span','Image delivery failed. Download the complete portable ZIP for offline plots; this does not change the saved result status.','screen-only-note'))};imageLink.append(img);card.append(imageLink);let caption=el('div',undefined,'caption');caption.append(el('h3',a.plot),el('span',a.rendering,'badge'+(a.rendering.startsWith('Archival native')?' warn':'')),el('div',`${a.scope} · ${a.cohort} · ${a.method} · ${a.direction}`,'meta'),el('div',a.status,'meta'));let actions=el('div',undefined,'actions');actions.append(link('PNG',a.href));let stem=a.relative_native_path.replace(/\.png$/i,''),pdf=task.assets.find(x=>x.extension==='.pdf'&&x.rendering===a.rendering&&x.relative_native_path.replace(/\.pdf$/i,'')===stem);if(pdf)actions.append(link(a.rendering==='Readable layout'?'Readable PDF':a.rendering.startsWith('Archival native')?'Archival PDF (known display issues)':'Original PDF',pdf.href));if(a.rendering==='Readable layout'){let original=task.assets.find(x=>x.extension==='.pdf'&&x.rendering==='Archival native (known display issues)'&&x.relative_native_path.replace(/\.pdf$/i,'')===stem);if(original)actions.append(link('Archival PDF (known display issues; preserved)',original.href));}caption.append(actions,el('div',a.relative_native_path,'file-path'));card.append(caption);gallery.append(card)});
 selected.filter(a=>a.extension!=='.png').forEach(a=>{let details=el('details',undefined,'table-row');details.append(el('summary',a.plot+' · '+a.scope+' · '+a.status));details.append(el('div',a.relative_native_path,'file-path'),link(a.transport?'Download complete original table (.tsv.gz)':'Download original '+a.extension.toUpperCase().slice(1),a.href));if(a.transport)details.append(el('p',a.transport+'; decompress to recover the exact native TSV bytes. Original '+a.original_native_receipt.bytes+' bytes; SHA256 '+a.original_native_receipt.sha256,'muted'));if(a.preview&&a.preview.length){details.append(el('p','Preview of up to 60 original rows; the download contains the complete unchanged native table.','muted'));let scroll=el('div',undefined,'table-scroll'),table=el('table');a.preview.forEach((row,i)=>{let tr=el('tr');row.forEach(v=>tr.append(el(i?'td':'th',v)));table.append(tr)});scroll.append(table);details.append(scroll)}sources.append(details)});if(!sources.children.length)sources.append(el('p','No table or source file matches these selections.','muted'))}
render();
</script></body></html>
