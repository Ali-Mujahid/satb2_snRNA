<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660"><rect x="0" y="0" width="1280" height="660" fill="white"/><text x="35" y="40" font-family="Arial,sans-serif" font-size="25" fill="#20353f" text-anchor="start" font-weight="700">Grm7 isoforms and presynaptic mGlu7</text><text x="35" y="71" font-family="Arial,sans-serif" font-size="14" fill="#20353f" text-anchor="start" font-weight="400">Two complete receptor models in this GTF; transcript and protein abundance are separate measurements</text><rect x="80" y="185" width="1120" height="22" fill="#dbe7e9"/><text x="85" y="130" font-family="Arial,sans-serif" font-size="16" fill="#20353f" text-anchor="start" font-weight="400">Extracellular / synaptic space</text><text x="85" y="245" font-family="Arial,sans-serif" font-size="16" fill="#20353f" text-anchor="start" font-weight="400">Presynaptic terminal cytoplasm</text><rect x="490" y="169" width="14" height="54" fill="#366c80"/><text x="497" y="160" font-family="Arial,sans-serif" font-size="11" fill="#20353f" text-anchor="middle" font-weight="400">1</text><rect x="529" y="169" width="14" height="54" fill="#366c80"/><text x="536" y="160" font-family="Arial,sans-serif" font-size="11" fill="#20353f" text-anchor="middle" font-weight="400">2</text><rect x="568" y="169" width="14" height="54" fill="#366c80"/><text x="575" y="160" font-family="Arial,sans-serif" font-size="11" fill="#20353f" text-anchor="middle" font-weight="400">3</text><rect x="607" y="169" width="14" height="54" fill="#366c80"/><text x="614" y="160" font-family="Arial,sans-serif" font-size="11" fill="#20353f" text-anchor="middle" font-weight="400">4</text><rect x="646" y="169" width="14" height="54" fill="#366c80"/><text x="653" y="160" font-family="Arial,sans-serif" font-size="11" fill="#20353f" text-anchor="middle" font-weight="400">5</text><rect x="685" y="169" width="14" height="54" fill="#366c80"/><text x="692" y="160" font-family="Arial,sans-serif" font-size="11" fill="#20353f" text-anchor="middle" font-weight="400">6</text><rect x="724" y="169" width="14" height="54" fill="#366c80"/><text x="731" y="160" font-family="Arial,sans-serif" font-size="11" fill="#20353f" text-anchor="middle" font-weight="400">7</text><ellipse cx="345" cy="120" rx="80" ry="40" fill="#d6e9eb" stroke="#366c80" stroke-width="2"/><text x="345" y="115" font-family="Arial,sans-serif" font-size="13" fill="#20353f" text-anchor="middle" font-weight="400">Glutamate-binding</text><text x="345" y="134" font-family="Arial,sans-serif" font-size="13" fill="#20353f" text-anchor="middle" font-weight="400">domain</text><path d="M425,130L495,180" fill="none" stroke="#366c80" stroke-width="3"/><text x="820" y="201" font-family="Arial,sans-serif" font-size="16" fill="#20353f" text-anchor="start" font-weight="400">Seven transmembrane helices</text><text x="80" y="355" font-family="Arial,sans-serif" font-size="20" fill="#146b80" text-anchor="start" font-weight="700">Grm7-202 · mGlu7A-like · 915 aa</text><text x="80" y="385" font-family="Arial,sans-serif" font-size="15" fill="#146b80" text-anchor="start" font-weight="400">GEAKTELCENVDPNSPAAKKKYVSYNNLVI</text><path d="M730,223L730,355" fill="none" stroke="#146b80" stroke-width="3"/><path d="M730,355L1130,355" fill="none" stroke="#146b80" stroke-width="3"/><text x="770" y="339" font-family="Arial,sans-serif" font-size="14" fill="#146b80" text-anchor="start" font-weight="400">Alternative intracellular C-terminal tail</text><text x="80" y="470" font-family="Arial,sans-serif" font-size="20" fill="#bd6934" text-anchor="start" font-weight="700">Grm7-201 · mGlu7B-like · 922 aa</text><text x="80" y="500" font-family="Arial,sans-serif" font-size="15" fill="#bd6934" text-anchor="start" font-weight="400">CENVDPNNCIPPVRKSVQKSVTWYTIPPTV</text><path d="M730,223L730,470" fill="none" stroke="#bd6934" stroke-width="3"/><path d="M730,470L1130,470" fill="none" stroke="#bd6934" stroke-width="3"/><text x="770" y="454" font-family="Arial,sans-serif" font-size="14" fill="#bd6934" text-anchor="start" font-weight="400">Alternative intracellular C-terminal tail</text><text x="80" y="565" font-family="Arial,sans-serif" font-size="14" fill="#20353f" text-anchor="start" font-weight="400">The partial Grm7-205 transcript also contains a B-like tail; it is not drawn as a third complete receptor.</text><text x="80" y="600" font-family="Arial,sans-serif" font-size="15" fill="#20353f" text-anchor="start" font-weight="700">RNA support does not establish membrane localization, protein abundance or the direction of a physiological change.</text><text x="80" y="632" font-family="Arial,sans-serif" font-size="13" fill="#20353f" text-anchor="start" font-weight="400">Presynaptic localization: Shigemoto et al., J Neurosci 1997. A/B splice forms: Corti et al., Eur J Neurosci 1998.</text></svg>