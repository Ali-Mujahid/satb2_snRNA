<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="675" viewBox="0 0 1280 675"><rect x="0" y="0" width="1280" height="675" fill="white"/><text x="35" y="40" font-family="Arial,sans-serif" font-size="25" fill="#20353f" text-anchor="start" font-weight="700">Grm7 terminal splicing: the key A/B distinction</text><text x="35" y="72" font-family="Arial,sans-serif" font-size="14" fill="#20353f" text-anchor="start" font-weight="400">Coordinate-defined RNA events; arrows show transcript order, not synaptic transmission</text><text x="35" y="155" font-family="Arial,sans-serif" font-size="20" fill="#146b80" text-anchor="start" font-weight="700">A-type · Grm7-202</text><rect x="365" y="135" width="140" height="40" fill="#146b80"/><rect x="1020" y="135" width="175" height="40" fill="#146b80"/><text x="435" y="125" font-family="Arial,sans-serif" font-size="13" fill="#20353f" text-anchor="middle" font-weight="400">Shared exon</text><text x="1105" y="125" font-family="Arial,sans-serif" font-size="13" fill="#20353f" text-anchor="middle" font-weight="400">Terminal exon</text><path d="M505,155 Q760,70 1020,155" fill="none" stroke="#146b80" stroke-width="3"/><text x="760" y="105" font-family="Arial,sans-serif" font-size="14" fill="#146b80" text-anchor="middle" font-weight="400">A-specific junction skips the 92-nt exon</text><text x="35" y="295" font-family="Arial,sans-serif" font-size="20" fill="#bd6934" text-anchor="start" font-weight="700">B-type · Grm7-201</text><rect x="365" y="275" width="140" height="40" fill="#bd6934"/><rect x="1020" y="275" width="175" height="40" fill="#bd6934"/><text x="435" y="265" font-family="Arial,sans-serif" font-size="13" fill="#20353f" text-anchor="middle" font-weight="400">Shared exon</text><text x="1105" y="265" font-family="Arial,sans-serif" font-size="13" fill="#20353f" text-anchor="middle" font-weight="400">Terminal exon</text><rect x="710" y="275" width="85" height="40" fill="#bd6934"/><text x="752" y="265" font-family="Arial,sans-serif" font-size="13" fill="#20353f" text-anchor="middle" font-weight="400">92 nt</text><path d="M505,295L710,295" fill="none" stroke="#bd6934" stroke-width="2"/><path d="M795,295L1020,295" fill="none" stroke="#bd6934" stroke-width="2"/><text x="605" y="325" font-family="Arial,sans-serif" font-size="13" fill="#20353f" text-anchor="middle" font-weight="400">B exon-entry junction</text><text x="910" y="325" font-family="Arial,sans-serif" font-size="13" fill="#20353f" text-anchor="middle" font-weight="400">Model-specific exit</text><text x="35" y="435" font-family="Arial,sans-serif" font-size="20" fill="#8e75ac" text-anchor="start" font-weight="700">Partial B-tail · Grm7-205</text><rect x="365" y="415" width="140" height="40" fill="#8e75ac"/><rect x="1020" y="415" width="175" height="40" fill="#8e75ac"/><text x="435" y="405" font-family="Arial,sans-serif" font-size="13" fill="#20353f" text-anchor="middle" font-weight="400">Shared exon</text><text x="1105" y="405" font-family="Arial,sans-serif" font-size="13" fill="#20353f" text-anchor="middle" font-weight="400">Terminal exon</text><rect x="710" y="415" width="85" height="40" fill="#8e75ac"/><text x="752" y="405" font-family="Arial,sans-serif" font-size="13" fill="#20353f" text-anchor="middle" font-weight="400">92 nt</text><path d="M505,435L710,435" fill="none" stroke="#8e75ac" stroke-width="2"/><path d="M795,435L1020,435" fill="none" stroke="#8e75ac" stroke-width="2"/><text x="605" y="465" font-family="Arial,sans-serif" font-size="13" fill="#20353f" text-anchor="middle" font-weight="400">B exon-entry junction</text><text x="910" y="465" font-family="Arial,sans-serif" font-size="13" fill="#20353f" text-anchor="middle" font-weight="400">Model-specific exit</text><text x="35" y="582" font-family="Arial,sans-serif" font-size="16" fill="#20353f" text-anchor="start" font-weight="700">A-type and B-type junction support can be counted without claiming that every complete transcript is reconstructed.</text><text x="35" y="613" font-family="Arial,sans-serif" font-size="14" fill="#20353f" text-anchor="start" font-weight="400">Grm7-205 contains a B-like tail but has an incomplete 5′ coding sequence. Its support is not proof of a complete receptor protein.</text><text x="35" y="645" font-family="Arial,sans-serif" font-size="13" fill="#20353f" text-anchor="start" font-weight="400">Introns and exon lengths are schematic. See terminal_splice_event_counts_per_mouse.tsv for exact coordinates and all twelve mice.</text></svg>